<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mob Run - Pi Network Game Pro</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121316;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: relative;
    }
    #gameCanvas {
      background: linear-gradient(to bottom, #d5cebe, #bfb7a4);
      box-shadow: 0 0 35px rgba(0,0,0,0.9);
      max-height: 100vh;
      max-width: 100vw;
      aspect-ratio: 540 / 800;
      display: block;
    }

    #top-nav {
      position: absolute;
      top: 12px;
      left: 15px;
      right: 15px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .interactive-btn {
      pointer-events: auto;
      cursor: pointer;
      border: none;
      outline: none;
      font-weight: bold;
      border-radius: 18px;
      padding: 6px 14px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: transform 0.1s;
    }
    .interactive-btn:active {
      transform: scale(0.95);
    }
    #pause-btn {
      background: #333946;
      color: #fff;
      border: 1px solid #6c7a89;
    }
    #shop-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: 1px solid #fef08a;
    }
    #sign-in-button {
      background: #ffb703;
      color: #1a1a1a;
      border: 2px solid #ffffff;
    }
    #user-profile {
      display: none;
      background: rgba(20, 20, 30, 0.85);
      color: #ffd700;
      border: 1px solid #ffd700;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 13px;
      font-weight: bold;
      pointer-events: auto;
    }

    #shop-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 380px;
      background: rgba(24, 26, 32, 0.96);
      border: 2px solid #ffd700;
      border-radius: 16px;
      padding: 20px;
      color: #fff;
      z-index: 200;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      text-align: center;
    }
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2b303c;
      padding: 10px 14px;
      margin: 10px 0;
      border-radius: 10px;
    }
    .shop-btn-buy {
      background: #ffb703;
      color: #1a1a1a;
      border: none;
      padding: 6px 12px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .close-shop-btn {
      margin-top: 10px;
      background: #475569;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="top-nav">
    <div style="display: flex; gap: 8px;">
      <button id="pause-btn" class="interactive-btn" onclick="togglePause()">⏸ Tạm Dừng</button>
      <button id="shop-btn" class="interactive-btn" onclick="toggleShop(true)">🛒 Shop Pi</button>
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button id="sign-in-button" class="interactive-btn" onclick="signIn()">Đăng nhập Pi</button>
      <div id="user-profile"></div>
    </div>
  </div>

  <div id="shop-modal">
    <h2 style="color: #ffd700; margin-bottom: 12px;">CỬA HÀNG VẬT PHẨM PI</h2>
    <div class="shop-item">
      <div style="text-align: left;">
        <strong>Buff Đạn Siêu Cấp</strong>
        <div style="font-size: 11px; color: #aaa;">Gấp đôi tốc bắn & số lượng đạn</div>
      </div>
      <button class="shop-btn-buy" onclick="buyItem('power_buff', 0.2, 'Buff Đạn Siêu Cấp')">0.2 Pi</button>
    </div>
    <div class="shop-item">
      <div style="text-align: left;">
        <strong>Giáp Hoàng Kim (Skin VIP)</strong>
        <div style="font-size: 11px; color: #aaa;">Đổi màu lính vàng & +10 lính viện trợ</div>
      </div>
      <button class="shop-btn-buy" onclick="buyItem('golden_skin', 0.5, 'Skin Hoàng Kim')">0.5 Pi</button>
    </div>
    <button class="close-shop-btn" onclick="toggleShop(false)">Đóng Cửa Hàng</button>
  </div>

  <canvas id="gameCanvas" width="540" height="800"></canvas>

  <script>
    // ----------------- HỆ THỐNG ÂM THANH (WEB AUDIO API) -----------------
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'gate') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.06);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === 'explosion') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.6);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      }
    }

    // ----------------- PI NETWORK SDK & THANH TOÁN -----------------
    let isAuthenticating = false;
    let currentUser = null;
    let hasGoldenSkin = false;
    let hasPowerBuff = false;

    async function initPi() {
      if (typeof window.Pi === "undefined") {
        console.warn("Chưa tải Pi SDK.");
        return;
      }
      try {
        await window.Pi.init({ version: "2.0", sandbox: true });
        await signIn();
      } catch (err) {
        console.error("Khởi tạo Pi thất bại:", err);
      }
    }

    async function signIn() {
      if (!window.Pi || isAuthenticating) return;
      isAuthenticating = true;
      const scopes = ["username", "payments"];

      function onIncompletePaymentFound(payment) {
        console.log("Xử lý giao dịch dang dở:", payment);
      }

      try {
        const authResult = await window.Pi.authenticate(scopes, onIncompletePaymentFound);
        currentUser = authResult.user;
        document.getElementById("sign-in-button").style.display = "none";
        const userProfile = document.getElementById("user-profile");
        userProfile.style.display = "block";
        userProfile.innerText = `@${currentUser.username}`;
      } catch (error) {
        console.error("Lỗi xác thực:", error);
      } finally {
        isAuthenticating = false;
      }
    }

    function buyItem(itemType, amountPi, memoText) {
      if (!window.Pi || !currentUser) {
        alert("Vui lòng đăng nhập tài khoản Pi trước khi mua!");
        return;
      }

      const paymentData = {
        amount: amountPi,
        memo: memoText,
        metadata: { itemType: itemType }
      };

      const callbacks = {
        onReadyForServerApproval: (paymentId) => {
          console.log("Sẵn sàng duyệt Server ID:", paymentId);
        },
        onReadyForServerCompletion: (paymentId, txid) => {
          console.log("Giao dịch thành công txid:", txid);
          applyPurchasedItem(itemType);
          toggleShop(false);
          alert(`Thanh toán thành công! Bạn đã nhận: ${memoText}`);
        },
        onCancel: (paymentId) => {
          console.log("Người dùng hủy thanh toán:", paymentId);
        },
        onError: (error, payment) => {
          console.error("Lỗi thanh toán:", error);
          alert("Giao dịch Pi thất bại.");
        }
      };

      window.Pi.createPayment(paymentData, callbacks);
    }

    function applyPurchasedItem(itemType) {
      if (itemType === 'power_buff') {
        hasPowerBuff = true;
      } else if (itemType === 'golden_skin') {
        hasGoldenSkin = true;
        mobCount += 10;
      } else if (itemType === 'revive') {
        mobCount = 20;
        gameState = "PLAYING";
      }
    }

    function buyRevive() {
      buyItem('revive', 0.1, 'Hồi Sinh Nhân Vật (Mob Run)');
    }

    window.addEventListener("DOMContentLoaded", initPi);

    // ----------------- CƠ CHẾ VÀ LOGIC GAME -----------------
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const SCREEN_WIDTH = 540;
    const SCREEN_HEIGHT = 800;

    let playerX = SCREEN_WIDTH / 2;
    const playerY = 660;
    let mobCount = 15;
    let scrollSpeed = 1.8;
    let gameState = "PLAYING";

    let score = 0;
    let highScore = localStorage.getItem("mobrun_highscore") || 0;
    let bossDefeated = 0;
    let currentBossLevel = 1;

    let bullets = [];
    let bossBullets = [];
    let sideGates = [];
    let barricades = [];
    let redEnemies = [];
    let bosses = [];
    let particles = [];
    let shootCd = 0;

    function togglePause() {
      if (gameState === "PLAYING") {
        gameState = "PAUSED";
        document.getElementById("pause-btn").innerText = "▶ Tiếp Tục";
      } else if (gameState === "PAUSED") {
        gameState = "PLAYING";
        document.getElementById("pause-btn").innerText = "⏸ Tạm Dừng";
      }
    }

    function toggleShop(show) {
      const modal = document.getElementById("shop-modal");
      if (show) {
        if (gameState === "PLAYING") togglePause();
        modal.style.display = "block";
      } else {
        modal.style.display = "none";
      }
    }

    function createExplosion(x, y, color = "#ffb703", count = 25) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 5 + 3,
          color: color,
          alpha: 1.0,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    function drawSoldier(x, y, isBlue = true, scale = 1.0) {
      let bodyCol = isBlue ? "#0d47a1" : "#b71c1c";
      let hatCol = isBlue ? "#1976d2" : "#e53935";
      
      if (isBlue && hasGoldenSkin) {
        bodyCol = "#d97706";
        hatCol = "#facc15";
      }

      const skinCol = "#f5cdb0";

      ctx.fillStyle = "rgba(0,0,0,0.15)";
      ctx.beginPath();
      ctx.ellipse(x, y + 6 * scale, 6 * scale, 3 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = bodyCol;
      ctx.beginPath();
      ctx.arc(x, y + 3 * scale, 5 * scale, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = skinCol;
      ctx.beginPath();
      ctx.arc(x, y - 1 * scale, 4 * scale, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = hatCol;
      ctx.beginPath();
      ctx.ellipse(x, y - 3 * scale, 4 * scale, 3 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBoss3D(boss) {
      const { x, y, hp, maxHp, flashTimer } = boss;

      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.beginPath();
      ctx.ellipse(x, y + 25, 55, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#991b1b";
      ctx.beginPath();
      ctx.moveTo(x - 30, y - 10);
      ctx.lineTo(x + 30, y - 10);
      ctx.lineTo(x + 22, y + 25);
      ctx.lineTo(x - 22, y + 25);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffbe8c";
      ctx.beginPath();
      ctx.ellipse(x - 38, y + 2, 11, 16, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 38, y + 2, 11, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y - 28, 17, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ff0000";
      ctx.beginPath();
      ctx.arc(x - 6, y - 28, 3, 0, Math.PI * 2);
      ctx.arc(x + 6, y - 28, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffe650";
      ctx.beginPath();
      ctx.arc(x, y - 38, 15, 0, Math.PI * 2);
      ctx.fill();

      const gunX = x + 18;
      const gunY = y + 5;
      ctx.fillStyle = "#2d3237";
      ctx.fillRect(gunX - 10, gunY - 10, 20, 22);
      ctx.fillStyle = "#191c1e";
      ctx.fillRect(gunX - 7, gunY + 12, 4, 25);
      ctx.fillRect(gunX - 2, gunY + 12, 4, 27);
      ctx.fillRect(gunX + 3, gunY + 12, 4, 25);

      if (flashTimer > 0) {
        ctx.fillStyle = "#ffe650";
        ctx.beginPath();
        ctx.arc(gunX, gunY + 44, 10, 0, Math.PI * 2);
        ctx.fill();
      }

      const hpPct = Math.max(0, hp / maxHp);
      ctx.fillStyle = "#1f2937";
      ctx.fillRect(x - 52, y - 76, 104, 12);
      ctx.fillStyle = hpPct > 0.5 ? "#22c55e" : (hpPct > 0.25 ? "#eab308" : "#ef4444");
      ctx.fillRect(x - 50, y - 74, 100 * hpPct, 8);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1;
      ctx.strokeRect(x - 52, y - 76, 104, 12);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";
      ctx.fillText(`TRÙM #${boss.level} HP: ${Math.ceil(hp)}`, x, y - 84);
    }

    function spawnTrackSegment(startY, level) {
      const extraDiff = Math.max(0, bossDefeated - 2);
      
      for (let i = 0; i < 10; i++) {
        const gy = startY - i * 75;
        const leftVal = Math.max(1, 4 - Math.floor(extraDiff * 0.5));
        const rightVal = Math.max(10, 50 - extraDiff * 6);

        sideGates.push({ x: 42, y: gy, w: 58, h: 32, val: leftVal, isLeft: true, triggered: false });
        sideGates.push({ x: SCREEN_WIDTH - 100, y: gy, w: 58, h: 32, val: rightVal, isLeft: false, triggered: false });
      }

      barricades.push({
        x: SCREEN_WIDTH - 300,
        y: startY - 420,
        w: 190,
        h: 44,
        hp: 120 + level * 50 + extraDiff * 60
      });

      const enemyRows = Math.min(28, 16 + level * 2 + extraDiff * 3);
      for (let row = 0; row < enemyRows; row++) {
        for (let col = 0; col < 8; col++) {
          redEnemies.push({
            x: SCREEN_WIDTH / 2 - 75 + col * 20 + (Math.random() * 8 - 4),
            y: (startY - 460) - row * 18 + (Math.random() * 6 - 3),
            alive: true
          });
        }
      }

      const bossHp = 100 + level * 50 + extraDiff * 90;
      bosses.push({
        x: SCREEN_WIDTH / 2,
        y: startY - 1100,
        level: level,
        hp: bossHp,
        maxHp: bossHp,
        shootTimer: 0,
        moveDir: 1,
        attackRate: Math.max(25, 75 - level * 4 - extraDiff * 6),
        flashTimer: 0
      });
    }

    function initGame() {
      playerX = SCREEN_WIDTH / 2;
      mobCount = 15;
      score = 0;
      bossDefeated = 0;
      currentBossLevel = 1;
      scrollSpeed = 1.8;
      bullets = [];
      bossBullets = [];
      sideGates = [];
      barricades = [];
      redEnemies = [];
      bosses = [];
      particles = [];
      gameState = "PLAYING";
      spawnTrackSegment(-100, 1);
    }

    initGame();

    let isDragging = false;
    function handlePointer(clientX) {
      if (gameState !== "PLAYING") return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      playerX = (clientX - rect.left) * scaleX;
      playerX = Math.max(60, Math.min(SCREEN_WIDTH - 60, playerX));
    }

    canvas.addEventListener("mousedown", (e) => {
      if (gameState === "GAMEOVER") { initGame(); return; }
      isDragging = true;
      handlePointer(e.clientX);
    });
    window.addEventListener("mousemove", (e) => { if (isDragging) handlePointer(e.clientX); });
    window.addEventListener("mouseup", () => { isDragging = false; });

    canvas.addEventListener("touchstart", (e) => {
      if (gameState === "GAMEOVER") { initGame(); return; }
      isDragging = true;
      handlePointer(e.touches[0].clientX);
    }, { passive: false });
    window.addEventListener("touchmove", (e) => {
      if (isDragging && e.touches.length > 0) handlePointer(e.touches[0].clientX);
    }, { passive: false });
    window.addEventListener("touchend", () => { isDragging = false; });

    function update() {
      if (gameState === "PLAYING") {
        score++;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem("mobrun_highscore", highScore);
        }

        scrollSpeed = 1.8 + Math.min(2.0, bossDefeated * 0.25);

        if (bosses.length === 0 || bosses[bosses.length - 1].y > -500) {
          currentBossLevel++;
          spawnTrackSegment(-300, currentBossLevel);
        }

        const shootInterval = hasPowerBuff ? 2 : 3;
        shootCd++;
        if (shootCd >= shootInterval) {
          shootCd = 0;
          let guns = Math.floor(Math.min(14, Math.max(2, mobCount / 5)));
          if (hasPowerBuff) guns = Math.min(18, guns + 4);

          for (let g = 0; g < guns; g++) {
            const ox = (g - (guns - 1) / 2) * 8;
            bullets.push({ x: playerX + ox, y: playerY - 25, speed: 17 });
          }
          playSound('shoot');
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;
          if (p.alpha <= 0) particles.splice(i, 1);
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.y -= b.speed;
          if (b.y < -30) { bullets.splice(i, 1); continue; }

          let hit = false;
          for (let bar of barricades) {
            if (bar.hp > 0 && b.x >= bar.x && b.x <= bar.x + bar.w && b.y >= bar.y && b.y <= bar.y + bar.h) {
              bar.hp -= (hasPowerBuff ? 3.0 : 1.5);
              playSound('hit');
              if (bar.hp <= 0) createExplosion(bar.x + bar.w / 2, bar.y + bar.h / 2, "#8c8e94", 20);
              hit = true;
              break;
            }
          }
          if (hit) { bullets.splice(i, 1); continue; }

          for (let e of redEnemies) {
            if (e.alive && Math.hypot(e.x - b.x, e.y - b.y) < 14) {
              e.alive = false;
              createExplosion(e.x, e.y, "#b71c1c", 8);
              playSound('hit');
              hit = true;
              break;
            }
          }
          if (hit) { bullets.splice(i, 1); continue; }

          for (let j = bosses.length - 1; j >= 0; j--) {
            const boss = bosses[j];
            if (Math.hypot(boss.x - b.x, boss.y - b.y) < 50) {
              boss.hp -= (hasPowerBuff ? 6.5 : 3.5);
              playSound('hit');
              
              if (boss.hp <= 0) {
                createExplosion(boss.x, boss.y, "#ff3232", 45);
                createExplosion(boss.x, boss.y - 30, "#ffe650", 30);
                playSound('explosion');
                bosses.splice(j, 1);
                bossDefeated++;
              }
              hit = true;
              break;
            }
          }
          if (hit) { bullets.splice(i, 1); continue; }
        }

        // Cập nhật Boss Lớn
        for (let i = bosses.length - 1; i >= 0; i--) {
          const boss = bosses[i];
          boss.y += scrollSpeed;
          boss.x += boss.moveDir * (1.0 + Math.min(1.5, bossDefeated * 0.15));
          if (boss.x < 150 || boss.x > SCREEN_WIDTH - 150) boss.moveDir *= -1;

          if (boss.flashTimer > 0) boss.flashTimer--;

          if (boss.y > -50 && boss.y < playerY) {
            boss.shootTimer++;
            if (boss.shootTimer >= boss.attackRate) {
              boss.shootTimer = 0;
              boss.flashTimer = 6;
              const angle = Math.atan2(playerY - (boss.y + 35), playerX - (boss.x + 18));
              bossBullets.push({
                x: boss.x + 18,
                y: boss.y + 35,
                vx: Math.cos(angle) * (4.5 + Math.min(2.5, bossDefeated * 0.2)),
                vy: Math.sin(angle) * (4.5 + Math.min(2.5, bossDefeated * 0.2))
              });
            }
          }

          if (Math.hypot(playerX - boss.x, playerY - boss.y) < 70) {
            boss.hp -= 10;
            mobCount = Math.max(0, mobCount - 3);
            if (boss.hp <= 0) {
              createExplosion(boss.x, boss.y, "#ff3232", 45);
              playSound('explosion');
              bosses.splice(i, 1);
              bossDefeated++;
              continue;
            }
          }

          // BOSS LỚN RƠI KHỎI MÀN HÌNH -> TRỪ 10 MÁU
          if (boss.y > SCREEN_HEIGHT + 100) {
            mobCount = Math.max(0, mobCount - 10);
            createExplosion(playerX, playerY, "#ef4444", 25);
            playSound('hit');
            bosses.splice(i, 1);
          }
        }

        // Cập nhật đạn của Boss
        for (let i = bossBullets.length - 1; i >= 0; i--) {
          const bb = bossBullets[i];
          bb.x += bb.vx;
          bb.y += bb.vy;

          if (Math.hypot(playerX - bb.x, playerY - bb.y) < 30) {
            mobCount = Math.max(0, mobCount - 3);
            createExplosion(bb.x, bb.y, "#ff5014", 12);
            playSound('hit');
            bossBullets.splice(i, 1);
            continue;
          }
          if (bb.y > SCREEN_HEIGHT + 20 || bb.x < 0 || bb.x > SCREEN_WIDTH) {
            bossBullets.splice(i, 1);
          }
        }

        // Cổng cấp số
        for (let i = sideGates.length - 1; i >= 0; i--) {
          const g = sideGates[i];
          g.y += scrollSpeed;
          if (!g.triggered && playerX >= g.x && playerX <= g.x + g.w && playerY >= g.y && playerY <= g.y + g.h) {
            mobCount += g.val;
            g.triggered = true;
            playSound('gate');
          }
          if (g.y > SCREEN_HEIGHT + 50) sideGates.splice(i, 1);
        }

        // Rào chắn
        for (let i = barricades.length - 1; i >= 0; i--) {
          const bar = barricades[i];
          bar.y += scrollSpeed;
          if (bar.hp > 0 && playerX >= bar.x && playerX <= bar.x + bar.w && playerY >= bar.y && playerY <= bar.y + bar.h) {
            const dmg = Math.min(bar.hp, mobCount);
            mobCount = Math.max(0, mobCount - dmg);
            bar.hp -= dmg;
            playSound('hit');
            if (bar.hp <= 0) createExplosion(bar.x + bar.w / 2, bar.y + bar.h / 2, "#8c8e94", 20);
          }
          if (bar.y > SCREEN_HEIGHT + 50) barricades.splice(i, 1);
        }

        // Cập nhật Boss Nhỏ (Lính đỏ)
        for (let i = redEnemies.length - 1; i >= 0; i--) {
          const e = redEnemies[i];
          e.y += scrollSpeed;

          if (e.alive && Math.hypot(playerX - e.x, playerY - e.y) < 25) {
            e.alive = false;
            mobCount = Math.max(0, mobCount - 1);
            createExplosion(e.x, e.y, "#b71c1c", 8);
            playSound('hit');
          }

          // BOSS NHỎ RƠI KHỎI MÀN HÌNH KHI CHƯA BỊ DIỆT -> TRỪ 1 MÁU
          if (e.y > SCREEN_HEIGHT + 30) {
            if (e.alive) {
              mobCount = Math.max(0, mobCount - 1);
              createExplosion(playerX, playerY, "#ff3232", 6);
              playSound('hit');
            }
            redEnemies.splice(i, 1);
          }
        }

        if (mobCount <= 0) {
          mobCount = 0;
          gameState = "GAMEOVER";
          playSound('gameover');
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

      ctx.fillStyle = "#a8abb2";
      ctx.fillRect(35, 0, SCREEN_WIDTH - 70, SCREEN_HEIGHT);
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 4;
      ctx.strokeRect(35, 0, SCREEN_WIDTH - 70, SCREEN_HEIGHT);

      for (let g of sideGates) {
        ctx.fillStyle = g.isLeft ? "#0284c7" : "#eab308";
        ctx.fillRect(g.x, g.y, g.w, g.h);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.strokeRect(g.x, g.y, g.w, g.h);
        ctx.fillStyle = g.isLeft ? "#ffffff" : "#1e1e1e";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`+${g.val}`, g.x + g.w / 2, g.y + 22);
      }

      for (let bar of barricades) {
        if (bar.hp > 0) {
          ctx.fillStyle = "#475569";
          ctx.fillRect(bar.x, bar.y, bar.w, bar.h);
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 20px Arial";
          ctx.textAlign = "center";
          ctx.fillText(`${Math.ceil(bar.hp)}`, bar.x + bar.w / 2, bar.y + 28);
        }
      }

      for (let e of redEnemies) {
        if (e.alive && e.y > -20 && e.y < SCREEN_HEIGHT + 20) {
          drawSoldier(e.x, e.y, false, 0.9);
        }
      }

      for (let boss of bosses) {
        if (boss.y > -120 && boss.y < SCREEN_HEIGHT + 100) {
          drawBoss3D(boss);
        }
      }

      for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (let b of bullets) {
        ctx.strokeStyle = hasPowerBuff ? "#f43f5e" : "#fde047";
        ctx.lineWidth = hasPowerBuff ? 4 : 3;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x, b.y - 12);
        ctx.stroke();
      }

      for (let bb of bossBullets) {
        ctx.fillStyle = "#ea580c";
        ctx.beginPath();
        ctx.arc(bb.x, bb.y, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      if (mobCount > 0) {
        const clusterR = Math.min(18 + Math.sqrt(mobCount) * 3.5, 65);
        const visCount = Math.min(mobCount, 55);
        for (let i = 0; i < visCount; i++) {
          const ang = (i * 2.39996);
          const d = (Math.sqrt(i) / Math.sqrt(visCount)) * clusterR;
          drawSoldier(playerX + d * Math.cos(ang), playerY + d * Math.sin(ang) * 0.7, true, 1.0);
        }

        ctx.fillStyle = "#0f172a";
        ctx.fillRect(playerX - 25, playerY - clusterR - 28, 50, 22);
        ctx.strokeStyle = hasGoldenSkin ? "#ffd700" : "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(playerX - 25, playerY - clusterR - 28, 50, 22);
        ctx.fillStyle = hasGoldenSkin ? "#ffd700" : "#ffffff";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`${mobCount}`, playerX, playerY - clusterR - 12);
      }

      ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
      ctx.fillRect(0, 0, SCREEN_WIDTH, 48);
      
      ctx.fillStyle = "#38bdf8";
      ctx.font = "bold 15px Arial";
      ctx.textAlign = "left";
      ctx.fillText(`LÍNH: ${mobCount}`, 15, 30);

      ctx.fillStyle = "#facc15";
      ctx.textAlign = "center";
      ctx.fillText(`DIỆT: ${bossDefeated} 💀`, SCREEN_WIDTH / 2, 30);

      ctx.fillStyle = "#cbd5e1";
      ctx.textAlign = "right";
      ctx.fillText(`KỶ LỤC: ${highScore}`, SCREEN_WIDTH - 15, 30);

      if (gameState === "PAUSED") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("TRÒ CHƠI TẠM DỪNG", SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2);
      }

      if (gameState === "GAMEOVER") {
        ctx.fillStyle = "rgba(10, 10, 15, 0.88)";
        ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

        ctx.fillStyle = "#ef4444";
        ctx.font = "bold 34px Arial";
        ctx.textAlign = "center";
        ctx.fillText("BẠN ĐÃ THẤT THỦ!", SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2 - 80);

        ctx.fillStyle = "#facc15";
        ctx.font = "bold 20px Arial";
        ctx.fillText(`Trùm đã diệt: ${bossDefeated}`, SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2 - 30);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px Arial";
        ctx.fillText(`Điểm trận này: ${score}`, SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2 + 5);
        ctx.fillText(`Điểm kỷ lục: ${highScore}`, SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2 + 30);

        ctx.fillStyle = "#ffb703";
        ctx.fillRect(SCREEN_WIDTH / 2 - 110, SCREEN_HEIGHT / 2 + 65, 220, 42);
        ctx.fillStyle = "#000000";
        ctx.font = "bold 15px Arial";
        ctx.fillText("HỒI SINH (0.1 Pi)", SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2 + 91);

        ctx.fillStyle = "#94a3b8";
        ctx.font = "14px Arial";
        ctx.fillText("Chạm bất kỳ đâu bên ngoài để chơi lại từ đầu", SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2 + 135);
      }
    }

    canvas.addEventListener("click", (e) => {
      if (gameState === "GAMEOVER") {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const cx = (e.clientX - rect.left) * scaleX;
        const cy = (e.clientY - rect.top) * scaleY;

        if (cx >= SCREEN_WIDTH / 2 - 110 && cx <= SCREEN_WIDTH / 2 + 110 &&
            cy >= SCREEN_HEIGHT / 2 + 65 && cy <= SCREEN_HEIGHT / 2 + 107) {
          buyRevive();
        }
      }
    });

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
